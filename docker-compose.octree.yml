# Octree stack: app (API + state-store bridge) + Dockerfile.worker replicas + postgres + redis.
# Start everything: docker compose -f docker-compose.octree.yml up --build --scale worker=3
# (deploy.replicas is ignored outside Swarm; use --scale for local replica count.)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.octree
    container_name: activepieces-app
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # APP + Redis watcher. Embedded worker count comes from env (/.jelenv): 1 on the 3.5GiB node, 0 with Dockerfile.worker replicas.
      - AP_CONTAINER_TYPE=${AP_CONTAINER_TYPE:-APP}
      - AP_OCTREE_EMBEDDED_WORKERS=${AP_OCTREE_EMBEDDED_WORKERS:-0}
      # Listen on 80 to match published 8080:80.
      - AP_PORT=80
      # Local-dev defaults when .env is missing or leaves secrets empty (fresh clone from .env-example).
      - AP_JWT_SECRET=${AP_JWT_SECRET:-local-dev-jwt-secret}
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD:-local-dev-postgres}
      - AP_POSTGRES_HOST=${AP_POSTGRES_HOST:-postgres}
      - AP_POSTGRES_PORT=${AP_POSTGRES_PORT:-5432}
      - AP_POSTGRES_DATABASE=${AP_POSTGRES_DATABASE:-activepieces}
      - AP_POSTGRES_USERNAME=${AP_POSTGRES_USERNAME:-postgres}
      - AP_REDIS_URL=${AP_REDIS_URL:-redis://redis:6379}
      - AP_STATE_STORE_NAMESPACE=${AP_STATE_STORE_NAMESPACE:-ap:default}
      - AP_STATE_STORE_BRIDGE_PORT=${AP_STATE_STORE_BRIDGE_PORT:-3847}
      - AP_STATE_STORE_BRIDGE_URL=${AP_STATE_STORE_BRIDGE_URL:-http://127.0.0.1:3847}
      - AP_FRONTEND_URL=${AP_FRONTEND_URL:-http://localhost:8080}
      - AP_WEBHOOK_URL=${AP_WEBHOOK_URL:-http://localhost:8080}
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - AP_CONTAINER_TYPE=WORKER
      # Docker service name — not localhost (see docs/install/options/docker-compose.mdx).
      - AP_FRONTEND_URL=http://app:80
      - AP_JWT_SECRET=${AP_JWT_SECRET:-local-dev-jwt-secret}
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD:-local-dev-postgres}
      - AP_POSTGRES_HOST=${AP_POSTGRES_HOST:-postgres}
      - AP_POSTGRES_PORT=${AP_POSTGRES_PORT:-5432}
      - AP_POSTGRES_DATABASE=${AP_POSTGRES_DATABASE:-activepieces}
      - AP_POSTGRES_USERNAME=${AP_POSTGRES_USERNAME:-postgres}
      - AP_REDIS_URL=${AP_REDIS_URL:-redis://redis:6379}
      - AP_WORKER_TOKEN=${AP_WORKER_TOKEN:-}
    volumes:
      - ./cache:/cache:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$AP_WORKER_TOKEN" ]; then
          echo "Waiting for app to publish AP_WORKER_TOKEN to ./cache/.ap_worker_token..."
          i=0
          while [ ! -f /cache/.ap_worker_token ]; do
            i=$$((i + 1))
            if [ $$i -gt 120 ]; then
              echo "Timed out waiting for /cache/.ap_worker_token — set AP_WORKER_TOKEN in .env or start app first"
              exit 1
            fi
            sleep 1
          done
          export AP_WORKER_TOKEN=$$(cat /cache/.ap_worker_token)
        fi
        exec node worker.js
    deploy:
      replicas: ${AP_WORKER_REPLICAS:-3}
    networks:
      - activepieces

  postgres:
    # pgvector required for knowledge base embeddings (CREATE EXTENSION vector)
    image: 'pgvector/pgvector:pg14'
    container_name: postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE:-activepieces}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD:-local-dev-postgres}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME:-postgres}'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - activepieces
  redis:
    image: 'redis:7.0.7'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'red_data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - activepieces
volumes:
  pg_data:
  red_data:
networks:
  activepieces:
