services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.octree
    container_name: activepieces-app
    restart: unless-stopped
    ports:
      - '8080:80'
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP_AND_WORKER
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  postgres:
    # pgvector required for knowledge base embeddings (CREATE EXTENSION vector)
    image: 'pgvector/pgvector:pg14'
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - activepieces
  redis:
    image: 'redis:7.0.7'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'red_data:/data'
    networks:
      - activepieces
volumes:
  pg_data:
  red_data:
networks:
  activepieces:
