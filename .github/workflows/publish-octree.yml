name: Publish octree image

on:
  push:
    branches:
      - packages/octree
  workflow_dispatch:

jobs:
  test-pieces:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Root package.json uses workspace:* (Bun/pnpm); npm does not resolve that protocol.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install

      # piece-decidim: npm script "test" is `vitest run` (see packages/pieces/community/decidim).
      # Turbo runs `build` first, then Vitest (turbo.json test.dependsOn + test/ inputs).
      - name: Run tests for decidim
        run: |
          npx turbo test --filter='@activepieces/piece-decidim'

      - name: Run tests for state-store
        run: |
          npx turbo test --filter='@activepieces/piece-state-store'

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-pieces

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push octree image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.octree
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/activepieces-octree:latest

